<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cupones</title>
<meta name="theme-color" content="#EFE8DA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14120E" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Una cuponera impresa: papel, tinta, talones troquelados y sellos. */
:root{
  --papel:#EFE8DA; --papel2:#E6DDCB; --hoja:#FFFBF3; --tinta:#1A160F; --gris:#6F6758; --tenue:#A69D8B; --linea:#D9CFBC;
  --rojo:#E5432A; --rojo2:#FF7A52; --amarillo:#FFE14D; --azulML:#2D3277; --verde:#1E7A4E;
  --f-tit:"Bricolage Grotesque",system-ui,sans-serif; --f-cod:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  .montos .monto.on::before{background:var(--rojo);opacity:.55}
  :root{ --papel:#14120E; --papel2:#1C1914; --hoja:#211D17; --tinta:#F3ECDF; --gris:#A79F8F; --tenue:#6B6457; --linea:#332E25;
         --rojo:#FF6644; --rojo2:#FF9A70; --verde:#52C48C; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tinta);font:15px/1.35 var(--f-tit)}
body{background-color:var(--papel);
  background-image:radial-gradient(rgba(120,100,60,.10) 1px,transparent 1.2px);background-size:5px 5px;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.env{max-width:720px;margin:0 auto;padding:0 18px}

/* ── Cabecera tipo portada ── */
.portada{padding:22px 0 6px;display:flex;align-items:flex-end;gap:14px;border-bottom:3px solid var(--tinta)}
.portada .t{flex:1;min-width:0}
.portada h1{margin:0;font-weight:800;font-size:46px;line-height:.86;letter-spacing:-.045em;text-transform:uppercase}
.portada h1 span{color:var(--rojo)}
.portada p{margin:8px 0 10px;font-size:13px;font-weight:500;color:var(--gris)}
.sello{width:54px;height:54px;flex:0 0 auto;margin-bottom:10px;border-radius:50%;border:2.5px solid var(--tinta);display:grid;place-items:center;transform:rotate(-8deg);transition:transform .25s}
.sello svg{width:22px;height:22px}
.sello:active{transform:rotate(-8deg) scale(.92)}
.sello.gira svg{animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.raya{height:1px;background:var(--tinta);margin-top:3px;opacity:.6}

/* ── Marcas: burbujas con el logo ── */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 10px}
.sec h2{margin:0;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.sec small{font-size:12px;color:var(--gris);font-weight:500}
.carr{position:relative;margin:0 -18px}
.fila{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 18px 4px}
.fila::-webkit-scrollbar{display:none}
.fila.arr{cursor:grabbing;user-select:none}.fila.arr *{pointer-events:none}
.fl{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:30px;height:30px;border-radius:50%;background:var(--tinta);color:var(--papel);display:grid;place-items:center;font-size:17px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .15s}
.fl.izq{left:6px}.fl.der{right:6px}
.carr.hi .fl.izq,.carr.hd .fl.der{opacity:1;pointer-events:auto}
@media (pointer:coarse){.fl{display:none}}

.marca{flex:0 0 auto;width:70px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0}
.burbuja{position:relative;width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px var(--linea);transition:box-shadow .15s,transform .12s;overflow:visible}
.burbuja img{width:38px;height:38px;object-fit:contain;border-radius:6px}
.burbuja .ini{font-weight:800;font-size:20px;color:#555}
.burbuja .n{position:absolute;right:-4px;top:-4px;min-width:21px;height:21px;border-radius:11px;padding:0 5px;background:var(--tinta);color:var(--papel);font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--papel)}
.marca span.nom{font-size:11.5px;font-weight:700;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--gris)}
.marca:active .burbuja{transform:scale(.93)}
.marca.on .burbuja{box-shadow:0 0 0 3px var(--rojo),0 0 0 6px var(--papel),0 0 0 7.5px var(--rojo)}
.marca.on span.nom{color:var(--tinta)}
.marca.ml.on .burbuja{box-shadow:0 0 0 3px var(--amarillo),0 0 0 6px var(--papel),0 0 0 7.5px #E3C200}
.marca.todas .burbuja{background:var(--tinta);color:var(--papel);font-size:13px;font-weight:800;box-shadow:none}
.marca.todas.on .burbuja{box-shadow:0 0 0 3px var(--rojo),0 0 0 6px var(--papel),0 0 0 7.5px var(--rojo)}

/* ── Monto: marcas de resaltador ── */
.monto{flex:0 0 auto;position:relative;padding:7px 12px;font-size:14.5px;font-weight:700;white-space:nowrap;color:var(--gris);border-radius:4px}
.monto.on{color:var(--tinta)}
.monto.on::before{content:"";position:absolute;left:4px;right:4px;bottom:6px;height:44%;background:var(--amarillo);opacity:.85;border-radius:2px;transform:skew(-8deg) rotate(-1deg);z-index:-1}
.montos{position:relative;z-index:0}

.total{margin:18px 0 12px;font-size:13px;color:var(--gris);display:flex;align-items:center;gap:8px}
.total b{font-family:var(--f-cod);font-size:13px;color:var(--tinta)}
.total::after{content:"";flex:1;border-top:1.5px dashed var(--linea)}

/* ── El cupón ── */
.lista{display:grid;gap:14px;padding-bottom:40px}
@media (min-width:640px){.lista{grid-template-columns:1fr 1fr}}
.cup{--c:var(--rojo);--ct:#fff;position:relative;display:flex;min-height:118px;cursor:pointer;filter:drop-shadow(0 1px 0 rgba(0,0,0,.06)) drop-shadow(0 8px 14px rgba(60,40,10,.12));animation:entra .35s cubic-bezier(.2,.8,.3,1) both;transition:transform .12s}
.cup:active{transform:rotate(-.4deg) scale(.985)}
@keyframes entra{from{opacity:0;transform:translateY(10px) rotate(.6deg)}}
.cup.ml{--c:var(--amarillo);--ct:var(--azulML)}
/* talón con el descuento, separado por el troquel */
.talon{flex:0 0 104px;background:var(--c);color:var(--ct);border-radius:14px 4px 4px 14px;padding:12px 10px;display:flex;flex-direction:column;justify-content:space-between;position:relative;
  -webkit-mask:radial-gradient(circle 9px at 100% 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 100% 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
          mask:radial-gradient(circle 9px at 100% 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 100% 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.talon .num{font-weight:800;font-size:34px;line-height:.85;letter-spacing:-.05em;white-space:nowrap}
.talon .num.chica{font-size:26px}
.talon .num small{font-size:16px;letter-spacing:-.02em}
.talon .off{font-family:var(--f-cod);font-size:11px;font-weight:800;letter-spacing:.18em;opacity:.85}
.talon .lg{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.talon .lg img{width:22px;height:22px;object-fit:contain}
.talon .lg .ini{font-size:13px;font-weight:800;color:#555}
.cuerpo{flex:1;min-width:0;background:var(--hoja);border-radius:4px 14px 14px 4px;padding:12px 14px 12px 15px;display:flex;flex-direction:column;gap:7px;position:relative;
  border-left:2px dashed var(--linea);
  -webkit-mask:radial-gradient(circle 9px at 0 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 0 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
          mask:radial-gradient(circle 9px at 0 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 0 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.cab{display:flex;align-items:baseline;gap:8px}
.cab .nom{flex:1;min-width:0;font-weight:800;font-size:16px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cab .vence{font-family:var(--f-cod);font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--gris);white-space:nowrap;text-transform:uppercase}
.cab .vence.apuro{color:var(--rojo)}
.letra{font-size:12.5px;color:var(--gris);font-weight:500;line-height:1.3}
.letra b{color:var(--tinta);font-weight:700}
.letra .tag{color:var(--rojo);font-weight:700}
.codigo{margin-top:auto;display:flex;align-items:center;gap:10px;border:1.5px solid var(--tinta);border-radius:8px;padding:7px 8px 7px 11px;background:var(--papel)}
.codigo span{flex:1;min-width:0;font-family:var(--f-cod);font-weight:800;font-size:16px;letter-spacing:.08em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.codigo em{font-style:normal;flex:0 0 auto;font-size:12px;font-weight:800;background:var(--tinta);color:var(--papel);border-radius:5px;padding:5px 9px;letter-spacing:.02em}
.codigo.busca{border-style:dashed;border-color:var(--tenue)}
.codigo.busca span{font-family:var(--f-tit);font-weight:600;font-size:13px;letter-spacing:0;color:var(--tenue)}
.codigo.busca::after{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--tenue);border-top-color:transparent;animation:gira .8s linear infinite}
/* el sello de COPIADO */
.marcaCopia{position:absolute;right:16px;top:50%;font-family:var(--f-cod);font-weight:800;font-size:20px;letter-spacing:.12em;color:var(--verde);border:3px solid var(--verde);border-radius:8px;padding:4px 10px;transform:translateY(-50%) rotate(-14deg) scale(1.6);opacity:0;pointer-events:none;background:color-mix(in srgb,var(--hoja) 70%,transparent)}
.cup.copiado .marcaCopia{animation:sellar .9s ease forwards}
@keyframes sellar{0%{opacity:0;transform:translateY(-50%) rotate(-14deg) scale(1.6)}18%{opacity:1;transform:translateY(-50%) rotate(-14deg) scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-50%) rotate(-14deg) scale(1)}}

.vacio{text-align:center;padding:44px 20px;border:2px dashed var(--linea);border-radius:16px;color:var(--gris)}
.vacio b{display:block;font-size:20px;font-weight:800;color:var(--tinta);letter-spacing:-.02em;margin-bottom:4px}
.pie{text-align:center;color:var(--tenue);font-size:11.5px;padding:0 0 30px;font-family:var(--f-cod)}

.actu{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;z-index:40;display:flex;align-items:center;gap:10px;background:var(--tinta);color:var(--papel);border-radius:14px;padding:12px 12px 12px 16px;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);animation:entra .3s ease both}
.actu div{flex:1;min-width:0;font-size:13px;line-height:1.3}.actu b{display:block;font-size:15px}
.actu button{flex:0 0 auto;background:var(--rojo);color:#fff;font-weight:800;border-radius:10px;padding:9px 14px;font-size:14px}
.actu button.no{background:transparent;color:var(--papel);opacity:.7;padding:9px 6px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,14px);opacity:0;background:var(--tinta);color:var(--papel);padding:10px 15px;border-radius:10px;font-weight:700;font-size:13.5px;transition:.22s;pointer-events:none;z-index:30}
.toast.ver{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="env">
  <header class="portada">
    <div class="t"><h1>Cupo<span>nes</span></h1><p id="fecha"></p></div>
    <button class="sello" id="btnAct" aria-label="Actualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
  </header>
  <div class="raya"></div>

  <div class="sec"><h2>Marcas</h2><small id="hora"></small></div>
  <div class="carr"><button class="fl izq" aria-label="Anteriores">‹</button><div class="fila" id="marcas"></div><button class="fl der" aria-label="Más">›</button></div>

  <div class="sec"><h2>¿Cuánto gastás?</h2></div>
  <div class="carr"><button class="fl izq" aria-label="Anteriores">‹</button><div class="fila montos" id="montos"></div><button class="fl der" aria-label="Más">›</button></div>

  <div class="total" id="total"></div>
  <div class="lista" id="lista"></div>
  <div class="pie">datos de soloprecio.com.ar · pueden agotarse sin aviso</div>
</div>
<div class="toast" id="toast"></div>
<script src="lector.js"></script>
<script>
const FUENTE = 'https://soloprecio.com.ar/cupones';
const ML = 'Mercado Libre';
const TOPES = [
  { t: 'Cualquier monto', v: Infinity }, { t: 'Sin mínimo', v: 0 }, { t: 'Hasta $50 mil', v: 50000 }, { t: 'Hasta $100 mil', v: 100000 },
  { t: 'Hasta $300 mil', v: 300000 }, { t: 'Hasta $500 mil', v: 500000 }, { t: 'Hasta $1 millón', v: 1000000 },
];
const leer = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let tope = leer('cup:tope2', null); if (tope === null) tope = Infinity;
let marcasSel = new Set(leer('cup:marcas', [ML]));
let cupones = [], cuando = null;
const enApp = !!(window.AppCup && AppCup.tituloDe);

const pesos = (n) => '$' + Math.round(n).toLocaleString('es-AR');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const slug = (t) => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const logo = (t) => `<img src="https://soloprecio.com.ar/brands/${slug(t)}.png?v=27" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;ini&quot;>${esc(String(t).slice(0, 1).toUpperCase())}</span>'">`;

// Los códigos de Mercado Libre están en el título de la lista a la que lleva el enlace ("EL CODIGO ES QUIMERA").
// Los busca la app (desde la PC Mercado Libre no deja leerlo) y quedan guardados por enlace.
const codigosML = leer('cup:codML', {});
const pedidos = new Set();
function codigoDeTitulo(t) {
  if (!t || !/C[OÓ]DIGO|CUP[OÓ]N/i.test(t)) return null;
  const p = t.trim().split(/\s+/).pop();
  return /^[A-Z0-9]{4,}$/i.test(p) ? p.toUpperCase() : null;
}
window.codigoListo = (link, titulo) => {
  if (titulo == null) { pedidos.delete(link); return; }
  codigosML[link] = codigoDeTitulo(titulo) || '';
  guardar('cup:codML', codigosML); pintarTodo();
};
const codigoDe = (c) => c.codigo || codigosML[c.link] || null;
const buscandoCodigo = (c) => !codigoDe(c) && enApp && c.tienda === ML && c.link && !(c.link in codigosML);
function pedirCodigos() {
  if (!enApp) return;
  for (const c of cupones) if (buscandoCodigo(c) && !pedidos.has(c.link)) { pedidos.add(c.link); AppCup.tituloDe(c.link); }
}

function minimoDe(c) {
  if (typeof c.compra_minima === 'number') return c.compra_minima;
  const m = /m[ií]nima\s*\$\s*([\d.]+)/i.exec((c.condicion_principal || '') + ' ' + (c.descripcion || ''));
  return m ? Number(m[1].replace(/\./g, '')) : null;
}
function venceDe(c) {
  if (!c.vence_en) return null;
  const d = new Date(c.vence_en), h = (d - Date.now()) / 36e5;
  if (h < 0) return { fuera: true };
  if (h < 24) return { t: h < 1 ? 'vence ya' : `vence en ${Math.floor(h)} h`, apuro: true };
  if (h < 48) return { t: 'vence mañana', apuro: true };
  return { t: 'hasta ' + d.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' }).replace('.', '') };
}
// Sólo los que tienen un código para copiar (o lo está buscando la app)
const conCodigo = () => cupones.filter((c) => (codigoDe(c) || buscandoCodigo(c)) && !(venceDe(c) || {}).fuera);
const entraEnMonto = (c) => { if (tope === Infinity) return true; const m = minimoDe(c); return m == null ? tope > 0 : m <= tope; };

// "$10.000 OFF" → "$10" + "mil"; "10% OFF" → "10%"
function descuentoCorto(c) {
  const b = (c.beneficio_principal || '').replace(/\s*OFF\s*$/i, '').trim();
  const n = /^\$\s*([\d.]+)$/.exec(b);
  if (n) { const v = Number(n[1].replace(/\./g, '')); return v >= 1e6 ? { n: '$' + (v / 1e6).toLocaleString('es-AR'), u: 'M' } : v >= 1000 ? { n: '$' + (v / 1000).toLocaleString('es-AR'), u: 'mil' } : { n: '$' + v, u: '' }; }
  const usd = /^hasta\s+usd\s*(\d+)/i.exec(b); if (usd) return { n: usd[1], u: 'USD' };
  return { n: b.length > 6 ? b.slice(0, 6) : b || '—', u: '' };
}
// Las marcas elegidas que hoy no tienen cupones no cuentan: si no queda ninguna, se ven todas
function seleccionEfectiva() { const hay = new Set(conCodigo().map((c) => c.tienda)); return new Set([...marcasSel].filter((m) => hay.has(m))); }

function pintarMarcas() {
  const lista = conCodigo(), cuenta = {};
  for (const c of lista) if (entraEnMonto(c)) cuenta[c.tienda] = (cuenta[c.tienda] || 0) + 1;
  const nombres = [...new Set(lista.map((c) => c.tienda))].sort((a, b) => (a === ML ? -1 : b === ML ? 1 : (cuenta[b] || 0) - (cuenta[a] || 0) || a.localeCompare(b)));
  const sel = seleccionEfectiva(), total = Object.values(cuenta).reduce((a, b) => a + b, 0);
  document.getElementById('marcas').innerHTML =
    `<button class="marca todas ${sel.size ? '' : 'on'}" data-todas="1"><span class="burbuja">TODAS<span class="n">${total}</span></span><span class="nom">Todas</span></button>` +
    nombres.map((t) => `<button class="marca ${t === ML ? 'ml' : ''} ${sel.has(t) ? 'on' : ''}" data-m="${esc(t)}">
      <span class="burbuja">${logo(t)}<span class="n">${cuenta[t] || 0}</span></span><span class="nom">${esc(t)}</span></button>`).join('');
}
function pintarMontos() {
  document.getElementById('montos').innerHTML = TOPES.map((x, i) => `<button class="monto ${x.v === tope ? 'on' : ''}" data-i="${i}">${x.t}</button>`).join('');
}
function pintar() {
  const lista = document.getElementById('lista'), tot = document.getElementById('total');
  if (!cupones.length) { tot.textContent = ''; lista.innerHTML = '<div class="vacio"><b>Buscando cupones…</b>Un segundo.</div>'; return; }
  const sel = seleccionEfectiva();
  const vis = conCodigo().filter((c) => (!sel.size || sel.has(c.tienda)) && entraEnMonto(c))
    .sort((a, b) => (a.tienda === ML ? 0 : 1) - (b.tienda === ML ? 0 : 1) || (minimoDe(a) ?? 1e15) - (minimoDe(b) ?? 1e15) || (b.descuento_monto || 0) - (a.descuento_monto || 0));
  tot.innerHTML = vis.length ? `<b>${vis.length}</b> ${vis.length === 1 ? 'código' : 'códigos'} · tocá uno para copiarlo` : '';
  if (!vis.length) { lista.innerHTML = `<div class="vacio"><b>Nada por acá</b>Probá con otro monto o tocá “Todas”.</div>`; return; }
  lista.innerHTML = vis.map((c, i) => {
    const m = minimoDe(c), v = venceDe(c), d = descuentoCorto(c), cod = codigoDe(c), esML = c.tienda === ML;
    const letra = [
      m == null ? 'Ver condiciones en la tienda' : m === 0 ? '<b>Sin compra mínima</b>' : `Comprando desde <b>${pesos(m)}</b>`,
      c.etiqueta ? `<span class="tag">${esc(c.etiqueta)}</span>` : '',
    ].filter(Boolean).join(' · ');
    return `<article class="cup ${esML ? 'ml' : ''}" ${cod ? `data-cod="${esc(cod)}"` : ''} style="animation-delay:${Math.min(i, 10) * 30}ms" title="${esc(c.descripcion || '')}">
      <div class="talon"><span class="lg">${logo(c.tienda)}</span><div><div class="num ${(d.n + d.u).length > 5 ? 'chica' : ''}">${esc(d.n)}${d.u ? `<small> ${d.u}</small>` : ''}</div><div class="off">OFF</div></div></div>
      <div class="cuerpo">
        <div class="cab"><span class="nom">${esc(c.tienda)}</span>${v ? `<span class="vence ${v.apuro ? 'apuro' : ''}">${v.t}</span>` : ''}</div>
        <div class="letra">${letra}</div>
        ${cod ? `<div class="codigo"><span>${esc(cod)}</span><em>COPIAR</em></div>` : `<div class="codigo busca"><span>Buscando el código…</span></div>`}
        <div class="marcaCopia">COPIADO</div>
      </div>
    </article>`;
  }).join('');
}
function pintarTodo() { pintarMarcas(); pintarMontos(); pintarHora(); pintar(); pedirCodigos(); }

document.getElementById('marcas').addEventListener('click', (e) => {
  const b = e.target.closest('.marca'); if (!b) return;
  if (b.dataset.todas) marcasSel.clear();
  else { const m = b.dataset.m; const sel = seleccionEfectiva(); marcasSel = sel; sel.has(m) ? marcasSel.delete(m) : marcasSel.add(m); }
  guardar('cup:marcas', [...marcasSel]); pintarMarcas(); pintar();
});
document.getElementById('montos').addEventListener('click', (e) => {
  const b = e.target.closest('.monto'); if (!b) return;
  tope = TOPES[b.dataset.i].v; guardar('cup:tope2', tope === Infinity ? null : tope); pintarMarcas(); pintarMontos(); pintar();
});

function aviso(t) { const x = document.getElementById('toast'); x.textContent = t; x.classList.add('ver'); clearTimeout(aviso.r); aviso.r = setTimeout(() => x.classList.remove('ver'), 1800); }
document.getElementById('lista').addEventListener('click', async (e) => {
  const card = e.target.closest('.cup[data-cod]'); if (!card) return;
  const t = card.dataset.cod;
  try { if (window.AppCup) AppCup.copiar(t); else await navigator.clipboard.writeText(t); }
  catch (er) { const x = document.createElement('textarea'); x.value = t; document.body.appendChild(x); x.select(); document.execCommand('copy'); x.remove(); }
  card.classList.remove('copiado'); void card.offsetWidth; card.classList.add('copiado');
  if (navigator.vibrate) navigator.vibrate(18);
  clearTimeout(card._t); card._t = setTimeout(() => card.classList.remove('copiado'), 950);
});

// Filas que se deslizan: dedo en el celular; flechas, ruedita y arrastre con el mouse en la PC
let arrastro = false;
document.querySelectorAll('.carr').forEach((carr) => {
  const f = carr.querySelector('.fila');
  const marcar = () => { carr.classList.toggle('hi', f.scrollLeft > 4); carr.classList.toggle('hd', f.scrollLeft + f.clientWidth < f.scrollWidth - 4); };
  f.addEventListener('scroll', marcar, { passive: true });
  new ResizeObserver(marcar).observe(f);
  new MutationObserver(marcar).observe(f, { childList: true });
  carr.querySelector('.izq').addEventListener('click', () => f.scrollBy({ left: -f.clientWidth * 0.8, behavior: 'smooth' }));
  carr.querySelector('.der').addEventListener('click', () => f.scrollBy({ left: f.clientWidth * 0.8, behavior: 'smooth' }));
  f.addEventListener('wheel', (e) => { if (f.scrollWidth <= f.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return; e.preventDefault(); f.scrollLeft += e.deltaY; }, { passive: false });
  let x0 = 0, s0 = 0, abajo = false;
  f.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse' || e.button !== 0) return; abajo = true; arrastro = false; x0 = e.clientX; s0 = f.scrollLeft; });
  window.addEventListener('pointermove', (e) => { if (!abajo) return; const dx = e.clientX - x0; if (!arrastro && Math.abs(dx) > 6) { arrastro = true; f.classList.add('arr'); } if (arrastro) f.scrollLeft = s0 - dx; });
  window.addEventListener('pointerup', () => { if (!abajo) return; abajo = false; f.classList.remove('arr'); setTimeout(() => { arrastro = false; }, 0); });
  marcar();
});
document.addEventListener('click', (e) => { if (arrastro && e.target.closest('.fila')) { e.stopPropagation(); e.preventDefault(); } }, true);

function pintarHora() {
  const f = new Date().toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('fecha').textContent = f.charAt(0).toUpperCase() + f.slice(1);
  document.getElementById('hora').textContent = cuando ? 'al día · ' + new Date(cuando).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false }) : 'buscando…';
}
async function traer() {
  const btn = document.getElementById('btnAct'); btn.classList.add('gira'); btn.disabled = true;
  try {
    const r = await fetch(FUENTE + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('la página contestó ' + r.status);
    cupones = leerCupones(await r.text()); cuando = Date.now();
    guardar('cup:datos', { cupones, cuando }); pintarTodo();
  } catch (e) {
    if (!cupones.length) document.getElementById('lista').innerHTML = `<div class="vacio"><b>Sin conexión</b>Revisá internet y tocá el sello de arriba.</div>`;
    else aviso('Sin conexión: se ven los últimos cupones');
  }
  btn.classList.remove('gira'); btn.disabled = false;
}
document.getElementById('btnAct').addEventListener('click', traer);

// Cartel propio de "hay una versión nueva de la app": lo pide la app de Android cuando hay una más nueva publicada
window.avisoActualizacion = () => {
  if (document.getElementById('actu')) return;
  const d = document.createElement('div'); d.className = 'actu'; d.id = 'actu';
  d.innerHTML = '<div><b>Hay una versión nueva</b><span id="actuTxt">Se instala en un toque.</span></div><button class="no" data-a="no">Después</button><button data-a="si">Actualizar</button>';
  d.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'no') { d.remove(); return; }
    b.textContent = 'Actualizando…'; b.disabled = true; if (window.AppCup && AppCup.actualizar) AppCup.actualizar();
  });
  document.body.appendChild(d);
};
window.estadoActualizacion = (t) => { const x = document.getElementById('actuTxt'); if (x) x.textContent = t; else aviso(t); };

const g = leer('cup:datos', null); if (g && g.cupones) { cupones = g.cupones; cuando = g.cuando; }
pintarTodo(); traer();
</script>
